  <!-- Typography -->
  <g transform="translate(140, 20)">
    <!-- Clases de (Italic Serif in Olive Green #7E913C) -->
    <text x="0" y="44" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="34" fill="#7E913C" letter-spacing="-0.5">Clases de</text>

    <!-- Inglés (Prominent Classical Bold Serif in Espresso Brown #382F2A) -->
    <text x="0" y="98" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="58" fill="#382F2A" letter-spacing="-1">Inglés</text>

    <!-- Mty (Serif in Olive Green #7E913C) -->
    <text x="175" y="142" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="38" fill="#7E913C">Mty</text>
